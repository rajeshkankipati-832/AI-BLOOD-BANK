{% extends 'base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="form-card">
  <h1 class="h3">Sign in</h1>
  <form method="post">
    {% include 'partials/csrf.html' %}
    <label class="form-label mt-3" for="login-email">Email</label>
    <input class="form-control" id="login-email" type="email" name="email" required autocomplete="email">
    <label class="form-label mt-3" for="login-password">Password</label>
    <div class="input-group"><input class="form-control" id="login-password" type="password" name="password" required autocomplete="current-password" data-password-field><button class="btn btn-outline-secondary" type="button" data-password-toggle="login-password" aria-label="Show password" aria-pressed="false">Show</button></div>
    <button class="btn btn-danger mt-4 w-100">Sign in</button>
  </form>
  <p class="mt-3 mb-0"><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
  <p class="mt-2 mb-0">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
</div>
{% endblock %}
