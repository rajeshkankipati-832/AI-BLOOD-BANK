{% extends 'base.html' %}

{% block title %}Donor registration{% endblock %}

{% block content %}
<div class="form-card">
    <h1 class="h3">Donor registration</h1>
    <p class="text-muted">
        Register your interest. Donation eligibility is determined by medical staff.
    </p>

    <form method="post">
        {% include 'partials/csrf.html' %}

        <label class="form-label" for="donor-fullname">Full name</label>
        <input class="form-control"
               id="donor-fullname"
               name="fullname"
               required
               value="{{ user.fullname if user else '' }}">

        <label class="form-label mt-3" for="donor-phone">Phone</label>
        <input class="form-control"
               id="donor-phone"
               name="phone"
               type="tel"
               value="{{ user.phone if user else '' }}">

        <label class="form-label mt-3" for="donor-blood-group">Blood group</label>
        <select class="form-select"
                id="donor-blood-group"
                name="blood_group"
                required>
            {% for b in ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'] %}
                <option value="{{ b }}"
                    {% if user and user.blood_group == b %}selected{% endif %}>
                    {{ b }}
                </option>
            {% endfor %}
        </select>

        <label class="form-label mt-3" for="donor-age">Age</label>
        <input class="form-control"
               id="donor-age"
               type="number"
               min="18"
               max="65"
               name="age"
               required
               value="{{ user.age if user else '' }}">

        <label class="form-label mt-3" for="donor-gender">Gender</label>
        <select class="form-select"
                id="donor-gender"
                name="gender"
                required>
            <option value="">Choose...</option>
            {% for choice in ['Female', 'Male', 'Other', 'Prefer not to say'] %}
                <option value="{{ choice }}"
                    {% if user and user.gender == choice %}selected{% endif %}>
                    {{ choice }}
                </option>
            {% endfor %}
        </select>

        <button class="btn btn-danger mt-4" type="submit">
            Save donor profile
        </button>
    </form>
</div>
{% endblock %}
