{% extends 'base.html' %}{% block title %}Donor registration{% endblock %}{% block content %}<div class="form-card"><h1 class="h3">Donor registration</h1><p class="text-muted">Register your interest. Donation eligibility is determined by medical staff.</p><form method="post">{% include 'partials/csrf.html' %}<label class="form-label">Full name</label><input class="form-control" name="fullname" required value="{{ user.fullname if user else '' }}"><label class="form-label mt-3">Phone</label><input class="form-control" name="phone" value="{{ user.phone if user else '' }}"><label class="form-label mt-3">Blood group</label><select class="form-select" name="blood_group" required>{% for b in ['A+','A-','B+','B-','AB+','AB-','O+','O-'] %}<option {% if user and user.blood_group==b %}selected{% endif %}>{{ b }}</option>{% endfor %}</select><label class="form-label mt-3">Age</label><input class="form-control" type="number" min="18" max="65" name="age" required value="{{ user.age if user else '' }}"><label class="form-label mt-3">Gender</label><input class="form-control" name="gender" value="{{ user.gender if user else '' }}"><button class="btn btn-danger mt-4">Save donor profile</button></form></div>{% endblock %}
