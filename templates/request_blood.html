{% extends 'base.html' %}{% block title %}Request blood{% endblock %}{% block content %}<div class="form-card"><h1 class="h3">Request blood</h1><form method="post">{% include 'partials/csrf.html' %}<label class="form-label mt-3">Patient name</label><input class="form-control" name="patient_name" required><label class="form-label mt-3">Blood group</label><select class="form-select" name="blood_group" required>{% for b in ['A+','A-','B+','B-','AB+','AB-','O+','O-'] %}<option>{{ b }}</option>{% endfor %}</select><label class="form-label mt-3">Units</label><input class="form-control" type="number" min="1" name="units" required><label class="form-label mt-3">Hospital</label><select class="form-select" name="hospital"><option value="">Choose later</option>{% for h in hospitals %}<option>{{ h.name }}</option>{% endfor %}</select><button class="btn btn-danger mt-4">Submit request</button></form></div>{% endblock %}
