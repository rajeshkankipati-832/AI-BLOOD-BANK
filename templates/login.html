{% extends 'base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="form-card">
  <h1 class="h3">Sign in</h1>
  <form method="post">
    {% include 'partials/csrf.html' %}
    <label class="form-label mt-3" for="email">Email</label>
    <input class="form-control" id="email" type="email" name="email" required autocomplete="email">
    <label class="form-label mt-3" for="password">Password</label>
    <div class="input-group"><input class="form-control" id="password" type="password" name="password" required autocomplete="current-password"><button class="btn btn-outline-secondary" type="button" data-toggle-password="password" aria-label="Show password">👁</button></div>
    <button class="btn btn-danger mt-4 w-100">Sign in</button>
  </form>
  <p class="mt-3 mb-0">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
</div>
{% endblock %}
