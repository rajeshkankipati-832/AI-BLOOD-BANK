{% extends 'base.html' %}{% block title %}Create account{% endblock %}{% block content %}<div class="form-card wide"><h1 class="h3">Create your account</h1><form method="post">{% include 'partials/csrf.html' %}<div class="row g-3"><div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" name="fullname" required value="{{ form.fullname if form else '' }}"></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required value="{{ form.email if form else '' }}"></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone"></div><div class="col-md-6"><label class="form-label">Blood group</label><select class="form-select" name="blood_group" required><option value="">Choose…</option>{% for b in ['A+','A-','B+','B-','AB+','AB-','O+','O-'] %}<option>{{ b }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Age</label><input class="form-control" type="number" min="18" max="65" name="age" required></div><div class="col-md-4"><label class="form-label">Gender</label><input class="form-control" name="gender"></div><div class="col-md-4"><label class="form-label">Password (8+ characters)</label><input class="form-control" type="password" name="password" minlength="8" required autocomplete="new-password"></div><div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" name="donor" id="donor"><label class="form-check-label" for="donor">I’m interested in donating blood</label></div></div><button class="btn btn-danger mt-4">Create account</button></form></div>{% endblock %}
