{% extends 'base.html' %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="form-card wide">
  <h1 class="h3">Create your account</h1>
  <form method="post" data-password-confirm>
    {% include 'partials/csrf.html' %}
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label" for="signup-fullname">Full name</label><input class="form-control" id="signup-fullname" name="fullname" required value="{{ form.fullname if form else '' }}" autocomplete="name"></div>
      <div class="col-md-6"><label class="form-label" for="signup-email">Email</label><input class="form-control" id="signup-email" type="email" name="email" required value="{{ form.email if form else '' }}" autocomplete="email"></div>
      <div class="col-md-6"><label class="form-label" for="signup-phone">Phone</label><input class="form-control" id="signup-phone" name="phone" value="{{ form.phone if form else '' }}" autocomplete="tel"></div>
      <div class="col-md-6"><label class="form-label" for="signup-blood">Blood group</label><select class="form-select" id="signup-blood" name="blood_group" required><option value="">Choose…</option>{% for b in ['A+','A-','B+','B-','AB+','AB-','O+','O-'] %}<option value="{{ b }}" {% if form and form.blood_group == b %}selected{% endif %}>{{ b }}</option>{% endfor %}</select></div>
      <div class="col-md-4"><label class="form-label" for="signup-age">Age</label><input class="form-control" id="signup-age" type="number" min="18" max="65" name="age" required value="{{ form.age if form and form.age else '' }}"></div>
    
<div class="col-md-4">
    <label class="form-label" for="gender">Gender</label>
    <select class="form-select" name="gender" id="gender" required>
        <option value="">Select gender</option>
        <option value="Male" {% if form and form.gender == 'Male' %}selected{% endif %}>Male</option>
        <option value="Female" {% if form and form.gender == 'Female' %}selected{% endif %}>Female</option>
        <option value="Other" {% if form and form.gender == 'Other' %}selected{% endif %}>Other</option>
 
        <option value="Prefer not to say" {% if form and form.gender == 'Prefer not to say' %}selected{% endif %}>Prefer not to say</option>
    </select>
</div>
      <div class="col-md-4"><label class="form-label" for="signup-password">Password (8+ characters)</label><div class="input-group"><input class="form-control" id="signup-password" type="password" name="password" minlength="8" required autocomplete="new-password" data-password-field><button class="btn btn-outline-secondary" type="button" data-password-toggle="signup-password" aria-label="Show password" aria-pressed="false">Show</button></div></div>
<div class="col-md-6">
  <label class="form-label" for="confirm_password">Confirm password</label>
  <div class="input-group">
    <input class="form-control" id="confirm_password" type="password"
           name="confirm_password" minlength="8" required
           autocomplete="new-password">
    <button class="btn btn-outline-secondary" type="button"
            data-password-toggle="confirm_password"
            aria-label="Show confirmation password"
            aria-pressed="false">Show</button>
  </div>
</div>
      <div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" name="donor" id="donor"><label class="form-check-label" for="donor">I'm interested in donating blood</label></div>
    </div>
    <button class="btn btn-danger mt-4">Create account</button>
  </form>
  <p class="mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
</div>
{% endblock %}
