<label class="form-label mt-3">Blood group</label><select class="form-select" name="blood_group" required>{% for b in ['A+','A-','B+','B-','AB+','AB-','O+','O-'] %}<option {% if blood and blood.blood_group==b %}selected{% endif %}>{{ b }}</option>{% endfor %}</select><label class="form-label mt-3">Units</label><input class="form-control" type="number" min="0" name="units" required value="{{ blood.units if blood else '' }}"><label class="form-label mt-3">Last updated</label><input class="form-control" name="last_updated" value="{{ blood.last_updated if blood else '' }}">
