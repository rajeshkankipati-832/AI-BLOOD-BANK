{% extends 'base.html' %}{% block title %}Donor details{% endblock %}{% block content %}<h1 class="h2">Donor details</h1><div class="card p-4 mt-3"><dl class="row"><dt class="col-sm-4">Name</dt><dd class="col-sm-8">{{ donor.fullname }}</dd><dt class="col-sm-4">Email</dt><dd class="col-sm-8">{{ donor.email }}</dd><dt class="col-sm-4">Phone</dt><dd class="col-sm-8">{{ donor.phone }}</dd><dt class="col-sm-4">Blood group</dt><dd class="col-sm-8">{{ donor.blood_group }}</dd><dt class="col-sm-4">Age</dt><dd class="col-sm-8">{{ donor.age }}</dd></dl><form method="post" action="{{ url_for('remove_donor_status',id=donor._id) }}">{% include 'partials/csrf.html' %}<button class="btn btn-outline-danger">Remove donor status</button></form></div><a class="btn btn-link mt-3" href="{{ url_for('manage_donors') }}">Back to donors</a>{% endblock %}
